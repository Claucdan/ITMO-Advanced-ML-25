<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="600" fill="#87CEEB"/>

  <!-- Grass -->
  <rect x="0" y="400" width="800" height="200" fill="#7CFC00"/>
  <!-- Grass blades -->
  <g fill="#228B22">
    <path d="M50 450 L60 400 L70 450 Z"/>
    <path d="M120 460 L130 410 L140 460 Z"/>
    <path d="M200 440 L210 390 L220 440 Z"/>
    <path d="M280 470 L290 420 L300 470 Z"/>
    <path d="M360 450 L370 400 L380 450 Z"/>
    <path d="M440 460 L450 410 L460 460 Z"/>
    <path d="M520 440 L530 390 L540 440 Z"/>
    <path d="M600 470 L610 420 L620 470 Z"/>
    <path d="M680 450 L690 400 L700 450 Z"/>
  </g>

  <!-- Lion -->
  <!-- Lion body (lying position) -->
  <ellipse cx="400" cy="450" rx="100" ry="50" fill="#CC7722" stroke="#8B4513" stroke-width="2"/>

  <!-- Lion head -->
  <circle cx="500" cy="430" r="40" fill="#CC7722" stroke="#8B4513" stroke-width="2"/>

  <!-- Mane (brown) -->
  <circle cx="500" cy="430" r="55" fill="#8B4513" opacity="0.9"/>
  <!-- Mane details -->
  <path d="M450 430 Q440 400 430 430" fill="none" stroke="#5D2E1F" stroke-width="3"/>
  <path d="M460 410 Q450 380 440 410" fill="none" stroke="#5D2E1F" stroke-width="3"/>
  <path d="M470 390 Q460 360 450 390" fill="none" stroke="#5D2E1F" stroke-width="3"/>
  <path d="M480 420 Q470 390 460 420" fill="none" stroke="#5D2E1F" stroke-width="3"/>
  <path d="M490 400 Q480 370 470 400" fill="none" stroke="#5D2E1F" stroke-width="3"/>

  <!-- Lion face -->
  <!-- Eyes (looking up) -->
  <ellipse cx="490" cy="420" rx="4" ry="6" fill="white"/>
  <ellipse cx="510" cy="420" rx="4" ry="6" fill="white"/>
  <circle cx="490" cy="418" r="2" fill="black"/>
  <circle cx="510" cy="418" r="2" fill="black"/>
  <!-- Nose -->
  <ellipse cx="500" cy="440" rx="8" ry="5" fill="black"/>
  <!-- Mouth -->
  <path d="M495 450 Q500 460 505 450" fill="none" stroke="black" stroke-width="2"/>

  <!-- Ears -->
  <circle cx="480" cy="400" r="10" fill="#CC7722"/>
  <circle cx="520" cy="400" r="10" fill="#CC7722"/>
  <circle cx="480" cy="400" r="5" fill="#8B4513"/>
  <circle cx="520" cy="400" r="5" fill="#8B4513"/>

  <!-- Front legs (lying) -->
  <rect x="350" y="450" width="20" height="60" rx="10" fill="#CC7722"/>
  <rect x="380" y="450" width="20" height="60" rx="10" fill="#CC7722"/>

  <!-- Hind legs -->
  <rect x="430" y="470" width="20" height="50" rx="10" fill="#CC7722"/>
  <rect x="460" y="470" width="20" height="50" rx="10" fill="#CC7722"/>

  <!-- Tail -->
  <path d="M300 450 Q250 400 280 380 Q260 350 300 360 Q320 320 350 340 Q340 300 380 320"
        fill="none" stroke="#CC7722" stroke-width="8" stroke-linecap="round"/>
  <circle cx="380" cy="320" r="10" fill="#CC7722"/>

  <!-- Clouds in the sky -->
  <circle cx="100" cy="100" r="30" fill="white" opacity="0.8"/>
  <circle cx="130" cy="90" r="25" fill="white" opacity="0.8"/>
  <circle cx="120" cy="120" r="20" fill="white" opacity="0.8"/>

  <circle cx="300" cy="150" r="35" fill="white" opacity="0.8"/>
  <circle cx="330" cy="140" r="30" fill="white" opacity="0.8"/>
  <circle cx="320" cy="170" r="25" fill="white" opacity="0.8"/>

  <circle cx="600" cy="80" r="40" fill="white" opacity="0.8"/>
  <circle cx="630" cy="70" r="35" fill="white" opacity="0.8"/>
  <circle cx="620" cy="100" r="30" fill="white" opacity="0.8"/>

  <!-- Sun -->
  <circle cx="700" cy="100" r="40" fill="#FFD700"/>
  <g fill="#FFD700" opacity="0.7">
    <circle cx="700" cy="60" r="10"/>
    <circle cx="740" cy="100" r="10"/>
    <circle cx="700" cy="140" r="10"/>
    <circle cx="660" cy="100" r="10"/>
    <circle cx="720" cy="70" r="10"/>
    <circle cx="720" cy="130" r="10"/>
    <circle cx="680" cy="70" r="10"/>
    <circle cx="680" cy="130" r="10"/>
  </g>

  <!-- Text label -->
  <text x="400" y="580" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Лев в саванне</text>
</svg>