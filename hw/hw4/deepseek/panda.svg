<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background: bamboo forest -->
  <rect x="0" y="0" width="800" height="600" fill="#90EE90"/>

  <!-- Bamboo stalks in background -->
  <g stroke="#228B22" stroke-width="15" stroke-linecap="round">
    <!-- Left bamboo -->
    <line x1="50" y1="600" x2="50" y2="100"/>
    <line x1="80" y1="600" x2="80" y2="150"/>
    <line x1="110" y1="600" x2="110" y2="200"/>

    <!-- Right bamboo -->
    <line x1="700" y1="600" x2="700" y2="120"/>
    <line x1="730" y1="600" x2="730" y2="180"/>
    <line x1="760" y1="600" x2="760" y2="250"/>

    <!-- Center background bamboo -->
    <line x1="200" y1="600" x2="200" y2="300"/>
    <line x1="600" y1="600" x2="600" y2="350"/>
  </g>

  <!-- Bamboo nodes (joints) -->
  <g fill="#228B22">
    <!-- Left bamboo nodes -->
    <rect x="43" y="200" width="14" height="20" rx="3"/>
    <rect x="43" y="350" width="14" height="20" rx="3"/>
    <rect x="73" y="250" width="14" height="20" rx="3"/>
    <rect x="73" y="400" width="14" height="20" rx="3"/>
    <rect x="103" y="300" width="14" height="20" rx="3"/>
    <rect x="103" y="450" width="14" height="20" rx="3"/>

    <!-- Right bamboo nodes -->
    <rect x="693" y="220" width="14" height="20" rx="3"/>
    <rect x="693" y="370" width="14" height="20" rx="3"/>
    <rect x="723" y="280" width="14" height="20" rx="3"/>
    <rect x="723" y="430" width="14" height="20" rx="3"/>
    <rect x="753" y="350" width="14" height="20" rx="3"/>
    <rect x="753" y="500" width="14" height="20" rx="3"/>

    <!-- Center bamboo nodes -->
    <rect x="193" y="400" width="14" height="20" rx="3"/>
    <rect x="593" y="450" width="14" height="20" rx="3"/>
  </g>

  <!-- Bamboo leaves -->
  <g fill="#2E8B57" stroke="#2E8B57" stroke-width="1">
    <!-- Left leaves -->
    <path d="M50 120 Q30 80 10 100 Q20 60 50 80 Q40 40 70 60"/>
    <path d="M80 170 Q60 130 40 150 Q50 110 80 130 Q70 90 100 110"/>
    <path d="M110 220 Q90 180 70 200 Q80 160 110 180 Q100 140 130 160"/>

    <!-- Right leaves -->
    <path d="M700 140 Q720 100 740 120 Q730 80 700 100 Q710 60 680 80"/>
    <path d="M730 200 Q750 160 770 180 Q760 140 730 160 Q740 120 710 140"/>
    <path d="M760 270 Q780 230 800 250 Q790 210 760 230 Q770 190 740 210"/>

    <!-- Center leaves -->
    <path d="M200 320 Q180 280 160 300 Q170 260 200 280 Q190 240 220 260"/>
    <path d="M600 370 Q620 330 640 350 Q630 310 600 330 Q610 290 580 310"/>
  </g>

  <!-- Other pandas in background -->
  <!-- Left background panda -->
  <g transform="translate(100, 350) scale(0.6)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="white" stroke="black" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="25" fill="white" stroke="black" stroke-width="2"/>
    <!-- Black patches -->
    <circle cx="-15" cy="-45" r="10" fill="black"/>
    <circle cx="15" cy="-45" r="10" fill="black"/>
    <!-- Ears -->
    <circle cx="-20" cy="-65" r="8" fill="black"/>
    <circle cx="20" cy="-65" r="8" fill="black"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-40" r="3" fill="black"/>
    <circle cx="10" cy="-40" r="3" fill="black"/>
    <!-- Nose -->
    <circle cx="0" cy="-30" r="3" fill="black"/>
    <!-- Mouth -->
    <path d="M-5 -25 Q0 -20 5 -25" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Legs -->
    <ellipse cx="-25" cy="10" rx="12" ry="8" fill="black"/>
    <ellipse cx="25" cy="10" rx="12" ry="8" fill="black"/>
  </g>

  <!-- Right background panda -->
  <g transform="translate(650, 400) scale(0.5)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="white" stroke="black" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="25" fill="white" stroke="black" stroke-width="2"/>
    <!-- Black patches -->
    <circle cx="-15" cy="-45" r="10" fill="black"/>
    <circle cx="15" cy="-45" r="10" fill="black"/>
    <!-- Ears -->
    <circle cx="-20" cy="-65" r="8" fill="black"/>
    <circle cx="20" cy="-65" r="8" fill="black"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-40" r="3" fill="black"/>
    <circle cx="10" cy="-40" r="3" fill="black"/>
    <!-- Nose -->
    <circle cx="0" cy="-30" r="3" fill="black"/>
    <!-- Mouth -->
    <path d="M-5 -25 Q0 -20 5 -25" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Legs -->
    <ellipse cx="-25" cy="10" rx="12" ry="8" fill="black"/>
    <ellipse cx="25" cy="10" rx="12" ry="8" fill="black"/>
  </g>

  <!-- Main panda (sitting, eating bamboo) -->
  <!-- Panda body (sitting position) -->
  <ellipse cx="400" cy="450" rx="80" ry="60" fill="white" stroke="black" stroke-width="3"/>

  <!-- Panda head -->
  <circle cx="400" cy="350" r="50" fill="white" stroke="black" stroke-width="3"/>

  <!-- Black patches around eyes -->
  <ellipse cx="370" cy="340" rx="20" ry="15" fill="black"/>
  <ellipse cx="430" cy="340" rx="20" ry="15" fill="black"/>

  <!-- Eyes -->
  <circle cx="370" cy="340" r="5" fill="white"/>
  <circle cx="430" cy="340" r="5" fill="white"/>
  <circle cx="370" cy="340" r="2" fill="black"/>
  <circle cx="430" cy="340" r="2" fill="black"/>

  <!-- Ears -->
  <circle cx="360" cy="310" r="15" fill="black"/>
  <circle cx="440" cy="310" r="15" fill="black"/>

  <!-- Nose -->
  <ellipse cx="400" cy="370" rx="8" ry="5" fill="black"/>

  <!-- Mouth -->
  <path d="M390 380 Q400 390 410 380" fill="none" stroke="black" stroke-width="2"/>

  <!-- Front legs (holding bamboo) -->
  <!-- Left front leg -->
  <ellipse cx="350" cy="460" rx="25" ry="40" fill="black" transform="rotate(-20 350 460)"/>
  <!-- Right front leg -->
  <ellipse cx="450" cy="460" rx="25" ry="40" fill="black" transform="rotate(20 450 460)"/>

  <!-- Bamboo stalk in hands -->
  <line x1="370" y1="380" x2="370" y2="520" stroke="#228B22" stroke-width="20" stroke-linecap="round"/>
  <!-- Bamboo nodes on stalk -->
  <rect x="362" y="410" width="16" height="25" rx="5" fill="#2E8B57"/>
  <rect x="362" y="470" width="16" height="25" rx="5" fill="#2E8B57"/>

  <!-- Bamboo leaves near panda's mouth -->
  <path d="M370 380 Q350 340 330 360 Q340 320 370 340 Q360 300 390 320" fill="#2E8B57"/>
  <path d="M370 380 Q390 340 410 360 Q400 320 370 340 Q380 300 350 320" fill="#2E8B57"/>

  <!-- Panda's rear (sitting) -->
  <ellipse cx="400" cy="520" rx="60" ry="40" fill="black"/>

  <!-- Hind legs -->
  <ellipse cx="340" cy="520" rx="20" ry="35" fill="black"/>
  <ellipse cx="460" cy="520" rx="20" ry="35" fill="black"/>

  <!-- Additional bamboo on ground -->
  <line x1="300" y1="550" x2="300" y2="580" stroke="#228B22" stroke-width="15" stroke-linecap="round"/>
  <line x1="500" y1="550" x2="500" y2="580" stroke="#228B22" stroke-width="15" stroke-linecap="round"/>
  <rect x="293" y="560" width="14" height="20" rx="3" fill="#2E8B57"/>
  <rect x="493" y="560" width="14" height="20" rx="3" fill="#2E8B57"/>

  <!-- Small panda cub in foreground -->
  <g transform="translate(550, 500) scale(0.4)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="30" fill="white" stroke="black" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="25" fill="white" stroke="black" stroke-width="2"/>
    <!-- Black patches -->
    <circle cx="-15" cy="-45" r="10" fill="black"/>
    <circle cx="15" cy="-45" r="10" fill="black"/>
    <!-- Ears -->
    <circle cx="-20" cy="-65" r="8" fill="black"/>
    <circle cx="20" cy="-65" r="8" fill="black"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-40" r="3" fill="black"/>
    <circle cx="10" cy="-40" r="3" fill="black"/>
    <!-- Nose -->
    <circle cx="0" cy="-30" r="3" fill="black"/>
    <!-- Mouth -->
    <path d="M-5 -25 Q0 -20 5 -25" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Legs -->
    <ellipse cx="-25" cy="10" rx="12" ry="8" fill="black"/>
    <ellipse cx="25" cy="10" rx="12" ry="8" fill="black"/>
  </g>

  <!-- Text label -->
  <text x="400" y="590" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Панда с бамбуком</text>
</svg>