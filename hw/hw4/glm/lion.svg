<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Небо (Голубое) -->
  <rect width="800" height="600" fill="#87CEEB"/>
  
  <!-- Солнце для атмосферы -->
  <circle cx="650" cy="100" r="60" fill="#FFF9C4" opacity="0.8"/>
  <circle cx="650" cy="100" r="45" fill="#FFEB3B" opacity="0.9"/>

  <!-- Дальняя трава (Светло-зелёная) -->
  <path d="M0,380 Q150,340 350,370 T700,350 L800,360 L800,600 L0,600 Z" fill="#81C784"/>
  
  <!-- Средняя трава (Зелёная) -->
  <path d="M0,440 Q200,410 400,440 T800,420 L800,600 L0,600 Z" fill="#66BB6A"/>
  
  <!-- Передняя трава (Тёмно-зелёная, на ней лежит лев) -->
  <path d="M0,510 Q200,490 450,510 T800,500 L800,600 L0,600 Z" fill="#43A047"/>

  <!-- Тело льва (Охра) -->
  <path d="M280,490 Q240,460 270,430 Q330,400 440,410 Q530,420 540,460 Q540,500 500,510 Z" fill="#D4A017"/>
  
  <!-- Задняя лапа -->
  <path d="M490,470 Q540,480 560,500 Q565,520 545,520 Q520,510 490,500 Z" fill="#C49515"/>

  <!-- Передние лапы (вытянуты вперед) -->
  <path d="M270,470 Q200,465 160,475 Q150,490 170,495 Q220,485 270,495 Z" fill="#D4A017"/>
  <path d="M290,475 Q240,470 210,480 Q200,495 220,500 Q250,490 290,500 Z" fill="#C49515"/>

  <!-- Хвост -->
  <path d="M535,470 Q580,450 600,420 Q615,400 610,385" stroke="#D4A017" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="609" cy="382" r="10" fill="#5D4037"/> <!-- Кисточка на хвосте (Бурая) -->

  <!-- Грива (Бурая, находится за головой) -->
  <path d="M265,400 Q230,390 215,410 Q200,435 210,460 Q220,480 250,485 Q275,490 295,480 Q320,465 320,440 Q320,415 305,400 Q290,385 265,400 Z" fill="#5D4037"/>
  <circle cx="220" cy="420" r="18" fill="#5D4037"/>
  <circle cx="225" cy="455" r="16" fill="#5D4037"/>
  <circle cx="280" cy="390" r="17" fill="#5D4037"/>
  <circle cx="310" cy="425" r="16" fill="#5D4037"/>
  <circle cx="305" cy="460" r="14" fill="#5D4037"/>

  <!-- Голова (Охра, запрокинута к небу) -->
  <circle cx="268" cy="410" r="40" fill="#D4A017" transform="rotate(-20, 268, 410)"/>

  <!-- Морда (Смотрит вверх) -->
  <path d="M245,395 Q240,385 255,378 Q270,375 280,385" fill="#C49515" stroke="#333" stroke-width="1"/>
  
  <!-- Нос -->
  <ellipse cx="262" cy="380" rx="4" ry="3" fill="#333"/>
  
  <!-- Глаза (Прищурены от смотрения в небо) -->
  <path d="M248,388 Q253,384 258,388" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M270,384 Q275,380 280,384" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Детали травы (Травинки поверх лап для объема) -->
  <path d="M150,490 Q155,470 160,490" stroke="#2E7D32" stroke-width="2" fill="none"/>
  <path d="M190,495 Q195,475 200,495" stroke="#2E7D32" stroke-width="2" fill="none"/>
  <path d="M560,510 Q565,490 570,510" stroke="#2E7D32" stroke-width="2" fill="none"/>
  <path d="M600,505 Q605,485 610,505" stroke="#2E7D32" stroke-width="2" fill="none"/>
</svg>
