<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="40%" stop-color="#4A90D9"/>
      <stop offset="75%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#B8E4F0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFACD"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DAE3B"/>
      <stop offset="50%" stop-color="#4A9E2F"/>
      <stop offset="100%" stop-color="#3D8B25"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D4A04A"/>
      <stop offset="100%" stop-color="#C4882F"/>
    </linearGradient>
    <radialGradient id="maneGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7B4B2A"/>
      <stop offset="50%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#3E1F0D"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- Sun with glow -->
  <circle cx="720" cy="90" r="80" fill="#FFD700" opacity="0.1"/>
  <circle cx="720" cy="90" r="55" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="720" cy="90" r="35" fill="#FFFACD" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.75">
    <ellipse cx="130" cy="90" rx="70" ry="28"/>
    <ellipse cx="175" cy="78" rx="55" ry="24"/>
    <ellipse cx="95" cy="85" rx="45" ry="20"/>
    <ellipse cx="155" cy="95" rx="40" ry="16"/>
  </g>
  <g fill="white" opacity="0.6">
    <ellipse cx="450" cy="60" rx="60" ry="22"/>
    <ellipse cx="490" cy="50" rx="50" ry="20"/>
    <ellipse cx="420" cy="55" rx="40" ry="16"/>
  </g>
  <g fill="white" opacity="0.5">
    <ellipse cx="300" cy="140" rx="50" ry="18"/>
    <ellipse cx="335" cy="132" rx="40" ry="15"/>
  </g>

  <!-- Distant hills -->
  <path d="M0,380 Q100,330 200,360 Q350,320 450,355 Q550,330 650,350 Q780,320 900,360 L900,400 L0,400 Z"
        fill="#A0926B" opacity="0.35"/>
  <path d="M0,390 Q150,365 300,380 Q450,360 600,375 Q750,355 900,380 L900,400 L0,400 Z"
        fill="#8B7D5B" opacity="0.25"/>

  <!-- Acacia tree left -->
  <g transform="translate(80, 280)">
    <path d="M0,0 L-2,-80 Q-1,-85 2,-80 L4,0" fill="#6B4E37"/>
    <path d="M-1,-50 L-25,-55" stroke="#6B4E37" stroke-width="3" fill="none"/>
    <path d="M1,-60 L20,-58" stroke="#6B4E37" stroke-width="2.5" fill="none"/>
    <ellipse cx="0" cy="-80" rx="40" ry="18" fill="#5B7E2A" opacity="0.8"/>
    <ellipse cx="-10" cy="-78" rx="30" ry="14" fill="#6B8E23" opacity="0.6"/>
    <ellipse cx="15" cy="-82" rx="25" ry="12" fill="#4E7A1E" opacity="0.5"/>
  </g>

  <!-- Acacia tree right -->
  <g transform="translate(780, 290)">
    <path d="M0,0 L-1,-65 Q0,-70 3,-65 L5,0" fill="#6B4E37"/>
    <path d="M1,-45 L15,-48" stroke="#6B4E37" stroke-width="2" fill="none"/>
    <ellipse cx="0" cy="-65" rx="32" ry="15" fill="#5B7E2A" opacity="0.75"/>
    <ellipse cx="8" cy="-63" rx="22" ry="11" fill="#6B8E23" opacity="0.5"/>
  </g>

  <!-- Grass ground -->
  <rect x="0" y="390" width="900" height="210" fill="url(#grassGrad)"/>
  <ellipse cx="450" cy="395" rx="480" ry="18" fill="#6DBE45" opacity="0.6"/>

  <!-- ============ LION ============ -->
  <g transform="translate(320, 310)">

    <!-- Shadow under lion -->
    <ellipse cx="60" cy="115" rx="110" ry="15" fill="#2E6B1A" opacity="0.35"/>

    <!-- Tail -->
    <path d="M170,55 C195,30 215,15 230,25 C240,32 242,45 235,50 C228,55 222,48 225,42"
          fill="none" stroke="#C4882F" stroke-width="7" stroke-linecap="round"/>
    <!-- Tail tuft -->
    <ellipse cx="228" cy="46" rx="11" ry="8" fill="#4A2510" transform="rotate(-10,228,46)"/>
    <ellipse cx="226" cy="44" rx="7" ry="5" fill="#3E1F0D" transform="rotate(-10,226,44)"/>

    <!-- Back hind leg -->
    <ellipse cx="140" cy="90" rx="24" ry="16" fill="#B87A28"/>
    <!-- Back hind paw -->
    <ellipse cx="152" cy="102" rx="14" ry="7" fill="#C89540"/>

    <!-- Front hind leg -->
    <ellipse cx="115" cy="85" rx="22" ry="18" fill="#C4882F"/>
    <!-- Front hind paw -->
    <ellipse cx="128" cy="100" rx="14" ry="7" fill="#C89540"/>
    <!-- Paw toes -->
    <circle cx="122" cy="102" r="3" fill="#B8832A"/>
    <circle cx="130" cy="103" r="3" fill="#B8832A"/>
    <circle cx="137" cy="102" r="3" fill="#B8832A"/>

    <!-- Main body -->
    <ellipse cx="75" cy="65" rx="95" ry="40" fill="url(#bodyGrad)"/>
    <!-- Belly highlight -->
    <ellipse cx="80" cy="80" rx="70" ry="20" fill="#D4A855" opacity="0.4"/>
    <!-- Body fur texture lines -->
    <g stroke="#B87A28" stroke-width="1" opacity="0.3" fill="none">
      <path d="M20,70 Q30,68 40,72"/>
      <path d="M50,75 Q60,73 70,77"/>
      <path d="M80,78 Q90,76 100,80"/>
      <path d="M110,72 Q120,70 130,74"/>
    </g>

    <!-- Front leg (back) -->
    <ellipse cx="5" cy="85" rx="16" ry="25" fill="#B87A28"/>
    <!-- Front paw (back) -->
    <ellipse cx="0" cy="105" rx="14" ry="7" fill="#C89540"/>

    <!-- Front leg (front) -->
    <ellipse cx="-18" cy="82" rx="16" ry="28" fill="#C4882F"/>
    <!-- Front paw (front) -->
    <ellipse cx="-22" cy="105" rx="14" ry="7" fill="#C89540"/>
    <!-- Paw toes -->
    <circle cx="-28" cy="107" r="3" fill="#B8832A"/>
    <circle cx="-22" cy="108" r="3" fill="#B8832A"/>
    <circle cx="-16" cy="107" r="3" fill="#B8832A"/>

    <!-- Neck connection -->
    <ellipse cx="-35" cy="42" rx="32" ry="32" fill="#C4882F"/>

    <!-- ===== MANE ===== -->
    <!-- Outer mane layers -->
    <ellipse cx="-55" cy="18" rx="58" ry="55" fill="#4A2510" opacity="0.8"/>
    <ellipse cx="-50" cy="15" rx="52" ry="50" fill="#5C3317" opacity="0.85"/>
    <ellipse cx="-48" cy="12" rx="46" ry="44" fill="url(#maneGrad)" opacity="0.9"/>
    <ellipse cx="-45" cy="10" rx="40" ry="38" fill="#6B3A1F" opacity="0.7"/>

    <!-- Mane tufts sticking out -->
    <ellipse cx="-100" cy="15" rx="18" ry="16" fill="#4A2510" opacity="0.7"/>
    <ellipse cx="-95" cy="30" rx="15" ry="14" fill="#5C3317" opacity="0.6"/>
    <ellipse cx="-90" cy="0" rx="14" ry="13" fill="#5C3317" opacity="0.65"/>
    <ellipse cx="-80" cy="-15" rx="12" ry="12" fill="#6B3A1F" opacity="0.55"/>
    <ellipse cx="-65" cy="-22" rx="10" ry="10" fill="#4A2510" opacity="0.5"/>
    <ellipse cx="-50" cy="-25" rx="8" ry="9" fill="#5C3317" opacity="0.45"/>
    <!-- Mane bottom tufts -->
    <ellipse cx="-65" cy="55" rx="20" ry="14" fill="#3E1F0D" opacity="0.5"/>
    <ellipse cx="-45" cy="60" rx="16" ry="12" fill="#4A2510" opacity="0.45"/>
    <!-- Mane hair detail -->
    <g stroke="#4A2510" stroke-width="2" opacity="0.4" fill="none">
      <path d="M-95,5 Q-100,-5 -90,-10"/>
      <path d="M-90,25 Q-100,20 -95,30"/>
      <path d="M-80,-10 Q-88,-18 -75,-20"/>
      <path d="M-60,-20 Q-65,-28 -55,-28"/>
    </g>

    <!-- ===== HEAD (tilted up, looking at sky) ===== -->
    <g transform="rotate(-30, -55, 15)">
      <!-- Head base -->
      <ellipse cx="-58" cy="5" rx="32" ry="28" fill="#D4A04A"/>

      <!-- Cheek fluff -->
      <ellipse cx="-78" cy="12" rx="12" ry="10" fill="#C89540" opacity="0.7"/>

      <!-- Snout -->
      <ellipse cx="-84" cy="0" rx="20" ry="16" fill="#DAB565"/>
      <!-- Snout top highlight -->
      <ellipse cx="-82" cy="-4" rx="14" ry="8" fill="#E2C478" opacity="0.5"/>

      <!-- Nose -->
      <path d="M-97,-5 Q-101,-11 -95,-13 Q-89,-11 -93,-5 Z" fill="#2C1810"/>
      <ellipse cx="-96" cy="-8" rx="2" ry="1.5" fill="#1A0E08" opacity="0.5"/>

      <!-- Nostril -->
      <ellipse cx="-97" cy="-7" rx="1.5" ry="1" fill="#1A0E08"/>

      <!-- Mouth -->
      <path d="M-96,-2 Q-92,4 -85,2" fill="none" stroke="#8B6914" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M-96,-2 Q-93,6 -88,5" fill="none" stroke="#8B6914" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

      <!-- Chin -->
      <ellipse cx="-80" cy="12" rx="10" ry="6" fill="#D4A855" opacity="0.4"/>

      <!-- Eye (looking upward) -->
      <ellipse cx="-65" cy="-7" rx="8" ry="6.5" fill="white"/>
      <circle cx="-65" cy="-10" r="4.5" fill="#5D4E37"/>
      <circle cx="-65" cy="-10" r="2.8" fill="#1A1A1A"/>
      <circle cx="-64" cy="-11.5" r="1.2" fill="white"/>
      <!-- Eye outline -->
      <path d="M-74,-7 Q-65,-14 -56,-7" fill="none" stroke="#3E2723" stroke-width="1.5"/>
      <path d="M-74,-7 Q-65,-2 -56,-7" fill="none" stroke="#3E2723" stroke-width="1"/>

      <!-- Second eye (partially visible, further away) -->
      <ellipse cx="-50" cy="-10" rx="5" ry="4.5" fill="white" opacity="0.7"/>
      <circle cx="-50" cy="-12" r="3" fill="#5D4E37" opacity="0.7"/>
      <circle cx="-50" cy="-12" r="1.8" fill="#1A1A1A" opacity="0.7"/>
      <circle cx="-49.5" cy="-13" r="0.8" fill="white" opacity="0.7"/>

      <!-- Eyebrow -->
      <path d="M-74,-14 Q-65,-20 -55,-14" fill="none" stroke="#3E1F0D" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Ears -->
      <ellipse cx="-38" cy="-12" rx="12" ry="16" fill="#C4882F"/>
      <ellipse cx="-38" cy="-10" rx="8" ry="11" fill="#D4A855" opacity="0.6"/>
      <!-- Inner ear -->
      <ellipse cx="-38" cy="-9" rx="5" ry="7" fill="#C89540" opacity="0.5"/>

      <ellipse cx="-52" cy="-20" rx="9" ry="13" fill="#B87A28" opacity="0.7"/>
      <ellipse cx="-52" cy="-18" rx="6" ry="9" fill="#C89540" opacity="0.4"/>

      <!-- Whiskers -->
      <g stroke="#9E8A6A" stroke-width="1.2" opacity="0.65">
        <line x1="-100" y1="-1" x2="-125" y2="-8"/>
        <line x1="-100" y1="2" x2="-128" y2="2"/>
        <line x1="-100" y1="5" x2="-125" y2="13"/>
        <line x1="-98" y1="0" x2="-120" y2="-5"/>
        <line x1="-98" y1="4" x2="-122" y2="9"/>
      </g>
      <!-- Whisker dots -->
      <g fill="#8B6914" opacity="0.4">
        <circle cx="-98" cy="0" r="1.2"/>
        <circle cx="-96" cy="3" r="1.2"/>
        <circle cx="-97" cy="6" r="1.2"/>
      </g>
    </g>
  </g>

  <!-- Foreground grass blades -->
  <g opacity="0.8">
    <path d="M30,600 Q28,560 35,520 Q30,558 40,598 Z" fill="#2E7D1E"/>
    <path d="M35,600 Q38,555 42,525 Q37,555 48,598 Z" fill="#3D8B25"/>
    <path d="M180,600 Q177,570 183,540 Q178,568 188,598 Z" fill="#2E7D1E"/>
    <path d="M185,600 Q190,560 195,535 Q189,558 200,598 Z" fill="#4A9E2F"/>
    <path d="M400,600 Q397,565 403,530 Q398,563 408,598 Z" fill="#2E7D1E"/>
    <path d="M405,600 Q410,555 415,528 Q409,553 420,598 Z" fill="#3D8B25"/>
    <path d="M600,600 Q597,570 603,540 Q598,568 608,598 Z" fill="#2E7D1E"/>
    <path d="M605,600 Q610,560 615,538 Q609,558 620,598 Z" fill="#4A9E2F"/>
    <path d="M780,600 Q777,568 783,535 Q778,565 788,598 Z" fill="#2E7D1E"/>
    <path d="M785,600 Q790,555 795,530 Q789,553 800,598 Z" fill="#3D8B25"/>
    <path d="M850,600 Q847,572 853,545 Q848,570 858,598 Z" fill="#2E7D1E"/>
  </g>

  <!-- Small wildflowers -->
  <g>
    <circle cx="90" cy="490" r="4" fill="#FF6B6B"/>
    <circle cx="90" cy="490" r="2" fill="#FFD93D"/>
    <circle cx="250" cy="500" r="3" fill="#C084FC"/>
    <circle cx="250" cy="500" r="1.5" fill="#FFD93D"/>
    <circle cx="500" cy="492" r="3.5" fill="#FF6B6B"/>
    <circle cx="500" cy="492" r="1.8" fill="#FFD93D"/>
    <circle cx="680" cy="498" r="3" fill="#FF6B6B"/>
    <circle cx="680" cy="498" r="1.5" fill="#FFD93D"/>
    <circle cx="820" cy="488" r="3.5" fill="#C084FC"/>
    <circle cx="820" cy="488" r="1.8" fill="#FFD93D"/>
  </g>

  <!-- Birds in the sky -->
  <g fill="none" stroke="#1A3A5C" stroke-width="1.8" stroke-linecap="round" opacity="0.35">
    <path d="M250,80 Q256,73 262,80 Q268,73 274,80"/>
    <path d="M290,100 Q295,94 300,100 Q305,94 310,100"/>
    <path d="M230,115 Q234,110 238,115 Q242,110 246,115"/>
    <path d="M560,140 Q565,134 570,140 Q575,134 580,140"/>
    <path d="M585,155 Q589,150 593,155 Q597,150 601,155"/>
  </g>

  <!-- Distant small bushes -->
  <ellipse cx="350" cy="388" rx="25" ry="10" fill="#4E7A1E" opacity="0.4"/>
  <ellipse cx="550" cy="392" rx="20" ry="8" fill="#5B8A22" opacity="0.35"/>
</svg>