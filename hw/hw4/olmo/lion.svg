<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="350" fill="#87CEEB"/>
  <rect x="0" y="350" width="800" height="150" fill="#228B22"/>
  <!-- Curved grass blades in the foreground (y ~ 400) -->
  <path d="M-80 450 C-100 430, -70 410, -40 390 l160,0 a32 32 0 1 0 0 0 0 32l-50 0 a32 32 0 1 0 0 0 0 32l50-80z" fill="#1E7A1E"/>
  <path d="M300 450 C320 430 340 410 350 390 l0-60 a24 24 0 1 1 0 0 0 24l-20 0a24 24 0 0 1 0 0 0 48 0l0 10" fill="#1E7A1E"/>
  <path d="M160 400 c-50 0-90 40-80 80a40 40 0 1 0 0 80l-30 0c0-10 20-40 30-40h-60v10l-10-10h60" fill="#228B22"/>
  <!-- Main lion body -->
  <ellipse cx="680" cy="425" rx="110" ry="70" fill="#E0B07F" stroke="#26334A" stroke-width="4"/>
  <!-- Lion head (centered above body) -->
  <ellipse cx="415" cy="310" rx="60" ry="40" fill="#A0522D" stroke="#26334A" stroke-width="2"/>
  <!-- Mane (large semi-circle behind head) -->
  <ellipse cx="420" cy="290" rx="70" ry="30" fill="#A0522D" stroke="#26334A" stroke-width="2"/>
  <!-- Foreground grass (behind head, lower body) -->
  <path d="M270 400 c-30 0-40-30-10-50l0-80c0-10 10-40 30-40h80v-10l-30 0c10 0 20-20 0-40 0" fill="#228B22" stroke="#000" stroke-width="1"/>
  <!-- Legs -->
  <ellipse cx="420" cy="370" rx="25" ry="15" fill="#A0522D" stroke="#26334A" stroke-width="2"/>
  <ellipse cx="340" cy="410" rx="22" ry="14" fill="#A0522D" stroke="#26334A" stroke-width="2"/>
  <!-- Paws -->
  <rect x="400" y="385" width="40" height="20" rx="10" ry="10" fill="#A0522D"/>
  <rect x="395" y="450" width="40" height="25" rx="8" ry="8" fill="#1E7A1E"/>
  <!-- Head details (eyes, nose, mouth) -->
  <ellipse cx="430" cy="360" rx="18" ry="12" fill="#E0B07F" stroke="#26334A" stroke-width="2"/>
  <!-- Eyes (dark, slightly above center) -->
  <ellipse cx="415" cy="360" rx="8" ry="5" fill="none" stroke="#26334A" stroke-width="2"/>
  <path d="M443 355c-18 5-10-10-10 0 15 0 0 0-10-5-10 0 0 0 10l-8-5M443 355" fill="#E0B07F"/>
  <ellipse cx="440" cy="355" rx="8" ry="5" fill="#26334A"/>
  <ellipse cx="435" cy="355" rx="6" ry="3" fill="none" stroke="#26334A" stroke-width="1" d="M415 370c0-8-8 0 0 8 0l0 10 0 0-10-4 0 0 0-7-5 0 0l40-15"/>
  <!-- Nose (small triangle) -->
  <path d="M445 360l-10-15 0-4 0 0-8-3 0 0-4l0-8" fill="#A0522D"/>
  <!-- Mouth (simple curve) -->
  <path d="M430 380c0-10-8 0 0 0-30-10 0 0-12 0 0 30 12 0l0 16" fill="none" stroke="#26334A" stroke-width="2"/>
  <ellipse cx="430" cy="355" rx="8" ry="6" fill="#E0B07F"/>
  <ellipse cx="420" cy="360" rx="8" ry="5" fill="#228B22"/>
  <!-- Whiskers -->
 </svg>