  <ellipse cx="278" cy="295" rx="10" ry="8" fill="#3a2000"/>
  <ellipse cx="278" cy="295" rx="7" ry="5" fill="#f0c060"/>
  <ellipse cx="278" cy="295" rx="4" ry="4" fill="#1a1000"/>
  <ellipse cx="276" cy="293" rx="2" ry="2" fill="white" opacity="0.6"/>
  <!-- Левый глаз -->
  <ellipse cx="255" cy="290" rx="9" ry="7" fill="#3a2000"/>
  <ellipse cx="255" cy="290" rx="6" ry="4.5" fill="#f0c060"/>
  <ellipse cx="255" cy="290" rx="3.5" ry="3.5" fill="#1a1000"/>
  <ellipse cx="253" cy="288" rx="1.5" ry="1.5" fill="white" opacity="0.6"/>

