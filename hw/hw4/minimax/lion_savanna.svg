  <line x1="238" y1="283" x2="198" y2="280" stroke="#e8d0a0" stroke-width="1.5" opacity="0.8"/>
  <line x1="238" y1="286" x2="200" y2="290" stroke="#e8d0a0" stroke-width="1.5" opacity="0.8"/>

