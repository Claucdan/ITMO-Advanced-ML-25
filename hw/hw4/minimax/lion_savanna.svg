  <!-- Акации на горизонте -->
  <!-- Дерево 1 -->
  <rect x="95" y="240" width="8" height="65" fill="#6a4010"/>
  <ellipse cx="99" cy="235" rx="38" ry="15" fill="#3a7a10"/>
  <ellipse cx="80" cy="240" rx="22" ry="10" fill="#4a8a18"/>
  <ellipse cx="118" cy="238" rx="25" ry="11" fill="#4a8a18"/>

  <!-- Дерево 2 -->
  <rect x="685" y="250" width="7" height="55" fill="#6a4010"/>
  <ellipse cx="688" cy="246" rx="32" ry="13" fill="#3a7a10"/>
  <ellipse cx="670" cy="250" rx="20" ry="9" fill="#4a8a18"/>
  <ellipse cx="706" cy="249" rx="22" ry="10" fill="#4a8a18"/>

  <!-- Дерево 3 (маленькое вдали) -->
  <rect x="510" y="265" width="5" height="38" fill="#7a4a18"/>
  <ellipse cx="512" cy="262" rx="22" ry="9" fill="#4a8a18"/>
  <ellipse cx="498" cy="265" rx="14" ry="7" fill="#3a7a10"/>
  <ellipse cx="526" cy="264" rx="15" ry="7" fill="#3a7a10"/>

</svg>
