    <line x1="680" y1="132" x2="680" y2="142"/>
    <line x1="628" y1="80" x2="618" y2="80"/>
    <line x1="732" y1="80" x2="742" y2="80"/>
    <line x1="644" y1="44" x2="637" y2="37"/>
    <line x1="716" y1="116" x2="723" y2="123"/>
    <line x1="716" y1="44" x2="723" y2="37"/>
    <line x1="644" y1="116" x2="637" y2="123"/>
