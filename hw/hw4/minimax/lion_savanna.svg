<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <!-- Небо -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa8d8"/>
      <stop offset="100%" stop-color="#a8d8f0"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aaa3a"/>
      <stop offset="100%" stop-color="#3a7a20"/>
    </linearGradient>
    <radialGradient id="lionBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a055"/>
      <stop offset="100%" stop-color="#b8822a"/>
    </radialGradient>
    <radialGradient id="maneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a4a1a"/>
      <stop offset="100%" stop-color="#4a2a08"/>
    </radialGradient>
  </defs>

  <!-- Небо -->
