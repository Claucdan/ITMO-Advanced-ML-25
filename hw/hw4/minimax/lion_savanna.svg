  <ellipse cx="658" cy="278" rx="18" ry="14" fill="#5a2e08" transform="rotate(-20, 658, 278)"/>
  <ellipse cx="655" cy="275" rx="12" ry="10" fill="#4a2008" transform="rotate(-20, 655, 275)"/>

