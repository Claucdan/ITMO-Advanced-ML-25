    <polygon points="340,415 347,382 354,415"/>
    <polygon points="390,418 397,388 404,418"/>
    <polygon points="450,420 457,385 464,420"/>
    <polygon points="500,415 507,383 514,415"/>
    <polygon points="150,418 157,388 164,418"/>
    <polygon points="200,420 207,385 214,420"/>
    <polygon points="250,415 258,380 266,415"/>
