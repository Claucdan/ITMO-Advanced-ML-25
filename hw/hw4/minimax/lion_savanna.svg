  <ellipse cx="300" cy="278" rx="8" ry="7" fill="#7a3a10"/>
  <ellipse cx="240" cy="270" rx="12" ry="10" fill="#b87020"/>
  <ellipse cx="240" cy="270" rx="7" ry="6" fill="#7a3a10"/>

