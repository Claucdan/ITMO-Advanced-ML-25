    <polygon points="30,300 35,270 40,300"/>
    <polygon points="60,300 67,265 74,300"/>
    <polygon points="90,300 96,275 102,300"/>
    <polygon points="130,300 136,268 142,300"/>
    <polygon points="680,300 686,272 692,300"/>
    <polygon points="710,300 717,260 724,300"/>
    <polygon points="750,300 756,270 762,300"/>
    <polygon points="780,300 786,265 792,300"/>

    <polygon points="20,305 26,278 32,305"/>
    <polygon points="50,305 57,272 64,305"/>
    <polygon points="170,302 176,275 182,302"/>
    <polygon points="640,302 646,278 652,302"/>
    <polygon points="730,302 736,275 742,302"/>
    <polygon points="760,302 767,268 774,302"/>
