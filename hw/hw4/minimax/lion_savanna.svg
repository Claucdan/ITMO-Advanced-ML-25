  <ellipse cx="420" cy="355" rx="170" ry="65" fill="#cc8e30" transform="rotate(-8, 420, 355)"/>

  <!-- Задние лапы -->
  <ellipse cx="570" cy="385" rx="55" ry="22" fill="#c07a20" transform="rotate(10, 570, 385)"/>
  <ellipse cx="560" cy="395" rx="48" ry="18" fill="#b87020" transform="rotate(15, 560, 395)"/>
