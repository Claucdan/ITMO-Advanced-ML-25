  <ellipse cx="600" cy="400" rx="20" ry="10" fill="#b86c1a"/>
  <ellipse cx="596" cy="402" rx="5" ry="8" fill="#a05a10"/>
  <ellipse cx="604" cy="401" rx="5" ry="8" fill="#a05a10"/>

  <!-- Передние лапы (вытянуты вперёд) -->
  <ellipse cx="265" cy="390" rx="60" ry="20" fill="#c07a20" transform="rotate(-5, 265, 390)"/>
  <ellipse cx="255" cy="400" rx="50" ry="16" fill="#b87020" transform="rotate(-8, 255, 400)"/>
