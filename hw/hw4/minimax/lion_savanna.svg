  <ellipse cx="215" cy="400" rx="22" ry="10" fill="#b86c1a"/>
  <ellipse cx="209" cy="402" rx="5" ry="8" fill="#a05a10"/>
  <ellipse cx="218" cy="401" rx="5" ry="8" fill="#a05a10"/>
  <ellipse cx="227" cy="400" rx="5" ry="8" fill="#a05a10"/>

