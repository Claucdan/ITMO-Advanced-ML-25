<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон: лес -->
  <rect width="100%" height="100%" fill="#A8D8B9" />

  <!-- Бамбук -->
  <g fill="none" stroke="#228B22" stroke-width="10">
    <!-- Бамбук 1 -->
    <line x1="100" y1="500" x2="100" y2="200" />
    <circle cx="100" cy="180" r="10" fill="#228B22" />
    <!-- Бамбук 2 -->
    <line x1="200" y1="500" x2="200" y2="220" />
    <circle cx="200" cy="200" r="10" fill="#228B22" />
    <!-- Бамбук 3 -->
    <line x1="300" y1="500" x2="300" y2="240" />
    <circle cx="300" cy="220" r="10" fill="#228B22" />
    <!-- Бамбук 4 -->
    <line x1="400" y1="500" x2="400" y2="260" />
    <circle cx="400" cy="240" r="10" fill="#228B22" />
    <!-- Бамбук 5 -->
    <line x1="500" y1="500" x2="500" y2="280" />
    <circle cx="500" cy="260" r="10" fill="#228B22" />
  </g>

  <!-- Панды -->
  <!-- Основная панда -->
  <g fill="#000000">
    <!-- Голова -->
    <circle cx="600" cy="300" r="50" />
    <!-- Тело -->
    <ellipse cx="600" cy="400" rx="50" ry="60" />
    <!-- Руки -->
    <path d="M550,350 Q570,330 590,350" stroke="#000000" stroke-width="10" fill="none" />
    <path d="M650,350 Q630,330 610,350" stroke="#000000" stroke-width="10" fill="none" />
    <!-- Глаза -->
    <circle cx="590" cy="290" r="10" fill="#FFFFFF" />
    <circle cx="610" cy="290" r="10" fill="#FFFFFF" />
    <circle cx="590" cy="290" r="5" fill="#000000" />
    <circle cx="610" cy="290" r="5" fill="#000000" />
    <!-- Нос -->
    <path d="M600,310 Q595,315 605,315" stroke="#000000" stroke-width="4" fill="none" />
  </g>

  <!-- Другие панды -->
  <g fill="#000000">
    <!-- Панда 1 -->
    <circle cx="700" cy="320" r="40" />
    <ellipse cx="700" cy="400" rx="40" ry="50" />
    <path d="M660,350 Q680,330 700,350" stroke="#000000" stroke-width="8" fill="none" />
    <path d="M740,350 Q720,330 700,350" stroke="#000000" stroke-width="8" fill="none" />
    <circle cx="690" cy="300" r="8" fill="#FFFFFF" />
    <circle cx="710" cy="300" r="8" fill="#FFFFFF" />
    <circle cx="690" cy="300" r="4" fill="#000000" />
    <circle cx="710" cy="300" r="4" fill="#000000" />
    <path d="M700,320 Q695,325 705,325" stroke="#000000" stroke-width="4" fill="none" />

    <!-- Панда 2 -->
    <circle cx="800" cy="340" r="40" />
    <ellipse cx="800" cy="420" rx="40" ry="50" />
    <path d="M760,370 Q780,350 800,370" stroke="#000000" stroke-width="8" fill="none" />
    <path d="M840,370 Q820,350 800,370" stroke="#000000" stroke-width="8" fill="none" />
    <circle cx="790" cy="320" r="8" fill="#FFFFFF" />
    <circle cx="810" cy="320" r="8" fill="#FFFFFF" />
    <circle cx="790" cy="320" r="4" fill="#000000" />
    <circle cx="810" cy="320" r="4" fill="#000000" />
    <path d="M800,340 Q795,345 805,345" stroke="#000000" stroke-width="4" fill="none" />
  </g>

  <!-- Бамбук в руках панды -->
  <g stroke="#228B22" stroke-width="10">
    <line x1="590" y1="350" x2="590" y2="280" />
    <circle cx="590" cy="260" r="10" fill="#228B22" />
  </g>
</svg>
