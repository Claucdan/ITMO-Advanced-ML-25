<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Небо -->
  <rect width="800" height="350" fill="#87CEEB"/>

  <!-- Солнце -->
  <circle cx="650" cy="80" r="40" fill="#FFD700" opacity="0.8"/>

  <!-- Облака -->
  <ellipse cx="150" cy="70" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="180" cy="60" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="60" rx="40" ry="20" fill="white" opacity="0.8"/>

  <ellipse cx="450" cy="100" rx="50" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="480" cy="90" rx="35" ry="18" fill="white" opacity="0.7"/>

  <!-- Далёкие деревья (акacia) -->
  <g fill="#228B22" opacity="0.6">
    <rect x="100" y="280" width="8" height="70"/>
    <ellipse cx="104" cy="270" rx="50" ry="25"/>

    <rect x="250" y="290" width="6" height="60"/>
    <ellipse cx="253" cy="280" rx="40" ry="20"/>

    <rect x="600" y="285" width="8" height="65"/>
    <ellipse cx="604" cy="275" rx="45" ry="22"/>
  </g>

  <!-- Трава/земля -->
  <rect y="350" width="800" height="250" fill="#90EE90"/>

  <!-- Трава детальнее -->
  <g stroke="#228B22" stroke-width="2" fill="none">
    <path d="M50 400 Q55 380 60 400"/>
    <path d="M70 420 Q75 390 80 420"/>
    <path d="M150 380 Q155 360 160 380"/>
    <path d="M200 450 Q205 420 210 450"/>
    <path d="M300 410 Q305 385 310 410"/>
    <path d="M450 430 Q455 405 460 430"/>
    <path d="M550 390 Q555 365 560 390"/>
    <path d="M650 440 Q655 415 660 440"/>
    <path d="M720 400 Q725 375 730 400"/>
  </g>

  <!-- Тень от льва -->
  <ellipse cx="400" cy="480" rx="120" ry="30" fill="#2E8B57" opacity="0.4"/>

  <!-- Лев -->
  <g transform="translate(320, 380)">
    <!-- Тело -->
    <ellipse cx="80" cy="70" rx="75" ry="45" fill="#CD853F"/>

    <!-- Задние лапы -->
    <ellipse cx="20" cy="95" rx="30" ry="20" fill="#CD853F"/>
    <ellipse cx="25" cy="105" rx="12" ry="8" fill="#8B4513"/>

    <!-- Передние лапы -->
    <ellipse cx="110" cy="90" rx="25" ry="35" fill="#CD853F"/>
    <ellipse cx="115" cy="115" rx="15" ry="10" fill="#8B4513"/>
    <ellipse cx="95" cy="100" rx="20" ry="30" fill="#CD853F"/>
    <ellipse cx="100" cy="120" rx="12" ry="8" fill="#8B4513"/>

    <!-- Грива -->
    <ellipse cx="130" cy="40" rx="45" ry="50" fill="#8B4513"/>
    <ellipse cx="115" cy="30" rx="35" ry="40" fill="#A0522D"/>
    <ellipse cx="140" cy="25" rx="30" ry="35" fill="#8B4513"/>

    <!-- Голова -->
    <ellipse cx="145" cy="55" rx="35" ry="32" fill="#CD853F"/>

    <!-- Морда -->
    <ellipse cx="165" cy="65" rx="18" ry="15" fill="#DEB887"/>

    <!-- Нос -->
    <ellipse cx="175" cy="60" rx="6" ry="5" fill="#8B4513"/>

    <!-- Глаз (смотрит вверх) -->
    <ellipse cx="155" cy="50" rx="5" ry="6" fill="#FFD700"/>
    <ellipse cx="157" cy="48" rx="2" ry="3" fill="black"/>

    <!-- Ухо -->
    <ellipse cx="125" cy="35" rx="10" ry="12" fill="#CD853F"/>
    <ellipse cx="127" cy="33" rx="5" ry="6" fill="#DEB887"/>

    <!-- Усы -->
    <g stroke="black" stroke-width="1" fill="none">
      <line x1="180" y1="65" x2="195" y2="60"/>
      <line x1="180" y1="68" x2="195" y2="68"/>
      <line x1="180" y1="71" x2="195" y2="76"/>
    </g>

    <!-- Хвост -->
    <path d="M10 65 Q-20 50 -30 30" stroke="#CD853F" stroke-width="12" fill="none" stroke-linecap="round"/>
    <ellipse cx="-32" cy="28" rx="10" ry="12" fill="#8B4513"/>

    <!-- Полоски на теле -->
    <ellipse cx="60" cy="55" rx="3" ry="8" fill="#A0522D" opacity="0.3"/>
    <ellipse cx="75" cy="50" rx="3" ry="10" fill="#A0522D" opacity="0.3"/>
    <ellipse cx="90" cy="55" rx="3" ry="8" fill="#A0522D" opacity="0.3"/>
  </g>

  <!-- Трава на переднем плане -->
  <g stroke="#32CD32" stroke-width="3" fill="none" opacity="0.8">
    <path d="M0 500 Q5 470 10 500"/>
    <path d="M30 520 Q35 480 40 520"/>
    <path d="M80 490 Q85 460 90 490"/>
    <path d="M120 530 Q125 500 130 530"/>
    <path d="M200 510 Q205 470 210 510"/>
    <path d="M280 540 Q285 500 290 540"/>
    <path d="M350 500 Q355 460 360 500"/>
    <path d="M480 520 Q485 480 490 520"/>
    <path d="M550 490 Q555 450 560 490"/>
    <path d="M620 530 Q625 490 630 530"/>
    <path d="M700 500 Q705 460 710 500"/>
    <path d="M760 520 Q765 480 770 520"/>
  </g>
</svg>