<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="800" height="600" fill="#E8F5E9"/>

  <!-- Бамбук на заднем плане -->
  <g opacity="0.5">
    <!-- Бамбук 1 -->
    <rect x="50" y="100" width="12" height="500" fill="#7CB342"/>
    <rect x="48" y="180" width="16" height="4" fill="#558B2F"/>
    <rect x="48" y="280" width="16" height="4" fill="#558B2F"/>
    <rect x="48" y="380" width="16" height="4" fill="#558B2F"/>
    <ellipse cx="56" cy="100" rx="20" ry="30" fill="#7CB342"/>

    <!-- Бамбук 2 -->
    <rect x="720" y="80" width="14" height="520" fill="#7CB342"/>
    <rect x="718" y="160" width="18" height="4" fill="#558B2F"/>
    <rect x="718" y="260" width="18" height="4" fill="#558B2F"/>
    <rect x="718" y="360" width="18" height="4" fill="#558B2F"/>
    <ellipse cx="727" cy="80" rx="22" ry="32" fill="#7CB342"/>

    <!-- Бамбук 3 -->
    <rect x="150" y="150" width="10" height="450" fill="#8BC34A"/>
    <rect x="148" y="220" width="14" height="3" fill="#689F38"/>
    <rect x="148" y="320" width="14" height="3" fill="#689F38"/>

    <!-- Бамбук 4 -->
    <rect x="650" y="200" width="11" height="400" fill="#8BC34A"/>
    <rect x="648" y="270" width="15" height="3" fill="#689F38"/>
    <rect x="648" y="370" width="15" height="3" fill="#689F38"/>
  </g>

  <!-- Панда на заднем плане (слева) -->
  <g transform="translate(120, 350) scale(0.5)">
    <!-- Тело -->
    <ellipse cx="50" cy="80" rx="55" ry="60" fill="white" stroke="#333" stroke-width="2"/>
    <ellipse cx="50" cy="80" rx="40" ry="45" fill="#333"/>

    <!-- Голова -->
    <circle cx="50" cy="30" r="35" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Уши -->
    <circle cx="20" cy="5" r="12" fill="#333"/>
    <circle cx="80" cy="5" r="12" fill="#333"/>

    <!-- Глаза -->
    <ellipse cx="35" cy="25" rx="10" ry="12" fill="#333"/>
    <ellipse cx="65" cy="25" rx="10" ry="12" fill="#333"/>
    <circle cx="37" cy="22" r="3" fill="white"/>
    <circle cx="67" cy="22" r="3" fill="white"/>

    <!-- Нос -->
    <ellipse cx="50" cy="38" rx="5" ry="3" fill="#333"/>

    <!-- Лапы -->
    <ellipse cx="20" cy="90" rx="12" ry="15" fill="#333"/>
    <ellipse cx="80" cy="90" rx="12" ry="15" fill="#333"/>
  </g>

  <!-- Панда на заднем плане (справа) -->
  <g transform="translate(600, 320) scale(0.45)">
    <!-- Тело -->
    <ellipse cx="50" cy="80" rx="55" ry="60" fill="white" stroke="#333" stroke-width="2"/>
    <ellipse cx="50" cy="80" rx="40" ry="45" fill="#333"/>

    <!-- Голова -->
    <circle cx="50" cy="30" r="35" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Уши -->
    <circle cx="20" cy="5" r="12" fill="#333"/>
    <circle cx="80" cy="5" r="12" fill="#333"/>

    <!-- Глаза -->
    <ellipse cx="35" cy="25" rx="10" ry="12" fill="#333"/>
    <ellipse cx="65" cy="25" rx="10" ry="12" fill="#333"/>
    <circle cx="37" cy="22" r="3" fill="white"/>
    <circle cx="67" cy="22" r="3" fill="white"/>

    <!-- Нос -->
    <ellipse cx="50" cy="38" rx="5" ry="3" fill="#333"/>

    <!-- Лапы -->
    <ellipse cx="20" cy="90" rx="12" ry="15" fill="#333"/>
    <ellipse cx="80" cy="90" rx="12" ry="15" fill="#333"/>
  </g>

  <!-- Бамбук на среднем плане -->
  <g>
    <rect x="200" y="250" width="15" height="350" fill="#7CB342"/>
    <rect x="197" y="320" width="21" height="5" fill="#558B2F"/>
    <rect x="197" y="420" width="21" height="5" fill="#558B2F"/>
    <rect x="197" y="520" width="21" height="5" fill="#558B2F"/>

    <!-- Листья бамбука -->
    <ellipse cx="230" cy="300" rx="30" ry="8" fill="#7CB342" transform="rotate(30 230 300)"/>
    <ellipse cx="180" cy="350" rx="25" ry="6" fill="#7CB342" transform="rotate(-25 180 350)"/>
    <ellipse cx="235" cy="450" rx="28" ry="7" fill="#7CB342" transform="rotate(35 235 450)"/>
  </g>

  <g>
    <rect x="580" y="280" width="14" height="320" fill="#8BC34A"/>
    <rect x="577" y="350" width="20" height="4" fill="#689F38"/>
    <rect x="577" y="450" width="20" height="4" fill="#689F38"/>

    <!-- Листья бамбука -->
    <ellipse cx="550" cy="330" rx="28" ry="7" fill="#8BC34A" transform="rotate(-30 550 330)"/>
    <ellipse cx="610" cy="380" rx="25" ry="6" fill="#8BC34A" transform="rotate(25 610 380)"/>
  </g>

  <!-- Главная панда (в центре) -->
  <g transform="translate(300, 250)">
    <!-- Ноги (сидит на попе) -->
    <ellipse cx="30" cy="180" rx="35" ry="40" fill="#333"/>
    <ellipse cx="130" cy="180" rx="35" ry="40" fill="#333"/>
    <ellipse cx="30" cy="180" rx="20" ry="25" fill="#222"/>
    <ellipse cx="130" cy="180" rx="20" ry="25" fill="#222"/>

    <!-- Тело -->
    <ellipse cx="80" cy="120" rx="70" ry="85" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Чёрные пятна на теле -->
    <ellipse cx="50" cy="100" rx="20" ry="25" fill="#333" opacity="0.9"/>
    <ellipse cx="110" cy="100" rx="20" ry="25" fill="#333" opacity="0.9"/>
    <ellipse cx="80" cy="150" rx="25" ry="20" fill="#333" opacity="0.8"/>

    <!-- Голова -->
    <circle cx="80" cy="50" r="50" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Уши -->
    <circle cx="30" cy="15" r="18" fill="#333"/>
    <circle cx="130" cy="15" r="18" fill="#333"/>

    <!-- Глаза -->
    <ellipse cx="60" cy="45" rx="14" ry="18" fill="#333"/>
    <ellipse cx="100" cy="45" rx="14" ry="18" fill="#333"/>
    <circle cx="63" cy="40" r="4" fill="white"/>
    <circle cx="103" cy="40" r="4" fill="white"/>

    <!-- Нос -->
    <ellipse cx="80" cy="65" rx="8" ry="5" fill="#333"/>

    <!-- Рот -->
    <path d="M70 75 Q80 82 90 75" stroke="#333" stroke-width="2" fill="none"/>

    <!-- Передние лапы -->
    <ellipse cx="50" cy="110" rx="18" ry="25" fill="#333"/>
    <ellipse cx="110" cy="110" rx="18" ry="25" fill="#333"/>

    <!-- Бамбук в лапах -->
    <g transform="rotate(-20 80 110)">
      <!-- Стебель бамбука -->
      <rect x="75" y="60" width="12" height="100" fill="#7CB342"/>
      <rect x="73" y="80" width="16" height="3" fill="#558B2F"/>
      <rect x="73" y="110" width="16" height="3" fill="#558B2F"/>
      <rect x="73" y="140" width="16" height="3" fill="#558B2F"/>

      <!-- Листья бамбука -->
      <ellipse cx="100" cy="80" rx="25" ry="7" fill="#7CB342" transform="rotate(40 100 80)"/>
      <ellipse cx="60" cy="100" rx="20" ry="6" fill="#7CB342" transform="rotate(-35 60 100)"/>
      <ellipse cx="105" cy="120" rx="22" ry="6" fill="#7CB342" transform="rotate(45 105 120)"/>
    </g>
  </g>

  <!-- Бамбук на переднем плане (слева) -->
  <g>
    <rect x="30" y="400" width="18" height="200" fill="#9CCC65"/>
    <rect x="27" y="480" width="24" height="5" fill="#7CB342"/>

    <!-- Листья -->
    <ellipse cx="60" cy="450" rx="35" ry="9" fill="#9CCC65" transform="rotate(35 60 450)"/>
    <ellipse cx="15" cy="520" rx="30" ry="8" fill="#9CCC65" transform="rotate(-30 15 520)"/>
  </g>

  <!-- Бамбук на переднем плане (справа) -->
  <g>
    <rect x="750" y="380" width="16" height="220" fill="#9CCC65"/>
    <rect x="747" y="460" width="22" height="4" fill="#7CB342"/>
    <rect x="747" y="540" width="22" height="4" fill="#7CB342"/>

    <!-- Листья -->
    <ellipse cx="720" cy="430" rx="32" ry="8" fill="#9CCC65" transform="rotate(-35 720 430)"/>
    <ellipse cx="775" cy="500" rx="28" ry="7" fill="#9CCC65" transform="rotate(30 775 500)"/>
  </g>

  <!-- Панда на среднем плане (справа, полностью видна) -->
  <g transform="translate(500, 400) scale(0.6)">
    <!-- Тело -->
    <ellipse cx="50" cy="100" rx="60" ry="70" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Ноги -->
    <ellipse cx="20" cy="150" rx="20" ry="25" fill="#333"/>
    <ellipse cx="80" cy="150" rx="20" ry="25" fill="#333"/>

    <!-- Голова -->
    <circle cx="50" cy="40" r="40" fill="white" stroke="#333" stroke-width="2"/>

    <!-- Уши -->
    <circle cx="15" cy="10" r="14" fill="#333"/>
    <circle cx="85" cy="10" r="14" fill="#333"/>

    <!-- Глаза -->
    <ellipse cx="35" cy="35" rx="12" ry="15" fill="#333"/>
    <ellipse cx="65" cy="35" rx="12" ry="15" fill="#333"/>
    <circle cx="37" cy="32" r="3" fill="white"/>
    <circle cx="67" cy="32" r="3" fill="white"/>

    <!-- Нос -->
    <ellipse cx="50" cy="50" rx="6" ry="4" fill="#333"/>

    <!-- Передние лапы -->
    <ellipse cx="30" cy="90" rx="15" ry="20" fill="#333"/>
    <ellipse cx="70" cy="90" rx="15" ry="20" fill="#333"/>

    <!-- Бамбук -->
    <g transform="rotate(15 70 80)">
      <rect x="65" y="40" width="10" height="70" fill="#7CB342"/>
      <rect x="63" y="60" width="14" height="2" fill="#558B2F"/>
      <rect x="63" y="90" width="14" height="2" fill="#558B2F"/>
      <ellipse cx="85" cy="60" rx="20" ry="5" fill="#7CB342" transform="rotate(35 85 60)"/>
    </g>
  </g>

  <!-- Листья бамбука на переднем плане -->
  <g opacity="0.9">
    <ellipse cx="250" cy="550" rx="40" ry="10" fill="#7CB342" transform="rotate(25 250 550)"/>
    <ellipse cx="550" cy="580" rx="35" ry="9" fill="#8BC34A" transform="rotate(-20 550 580)"/>
    <ellipse cx="400" cy="590" rx="30" ry="8" fill="#9CCC65" transform="rotate(10 400 590)"/>
  </g>

  <!-- Тень от главной панды -->
  <ellipse cx="380" cy="520" rx="100" ry="25" fill="#33691E" opacity="0.2"/>
</svg>