<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!--defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
  </defs-->

  <!-- Небо -->
  <rect x="0" y="0" width="800" height="400" fill="#87CEEB"/>

  <!-- Земля/Саванна -->
  <rect x="0" y="400" width="800" height="200" fill="#7CB342"/>

  <!-- Дальняя трава -->
  <ellipse cx="100" cy="420" rx="80" ry="30" fill="#689F38"/>
  <ellipse cx="250" cy="430" rx="100" ry="35" fill="#689F38"/>
  <ellipse cx="450" cy="425" rx="90" ry="32" fill="#689F38"/>
  <ellipse cx="650" cy="435" rx="110" ry="38" fill="#689F38"/>
  <ellipse cx="750" cy="420" rx="70" ry="28" fill="#689F38"/>

  <!-- Солнце -->
  <circle cx="700" cy="80" r="50" fill="#FFD54F"/>

  <!-- Облака -->
  <ellipse cx="150" cy="100" rx="60" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="180" cy="95" rx="50" ry="22" fill="white" opacity="0.9"/>
  <ellipse cx="210" cy="100" rx="55" ry="23" fill="white" opacity="0.9"/>

  <ellipse cx="400" cy="120" rx="70" ry="28" fill="white" opacity="0.8"/>
  <ellipse cx="440" cy="115" rx="60" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="480" cy="120" rx="65" ry="26" fill="white" opacity="0.8"/>

  <!-- Лев, лежащий на траве -->
  <g transform="translate(400, 450)">

    <!-- Задние лапы (сложенные) -->
    <ellipse cx="-60" cy="20" rx="25" ry="18" fill="#D4A574"/>
    <ellipse cx="-40" cy="25" rx="20" ry="15" fill="#D4A574"/>

    <!-- Хвост -->
    <path d="M -80 10 Q -120 -10 -130 5" stroke="#D4A574" stroke-width="8" fill="none"/>
    <circle cx="-130" cy="5" r="8" fill="#5D4E37"/>

    <!-- Задняя часть тела -->
    <ellipse cx="-30" cy="0" rx="70" ry="40" fill="#D4A574"/>

    <!-- Передняя часть тела -->
    <ellipse cx="60" cy="5" rx="75" ry="42" fill="#D4A574"/>

    <!-- Передние лапы (сложенные) -->
    <ellipse cx="40" cy="35" rx="22" ry="20" fill="#D4A574"/>
    <ellipse cx="70" cy="38" rx="22" ry="20" fill="#D4A574"/>
    <ellipse cx="40" cy="50" rx="18" ry="12" fill="#D4A574"/>
    <ellipse cx="70" cy="52" rx="18" ry="12" fill="#D4A574"/>

    <!-- Шея -->
    <ellipse cx="100" cy="-15" rx="35" ry="30" fill="#D4A574"/>

    <!-- Грива (бурая) -->
    <circle cx="130" cy="-35" r="55" fill="#5D4E37"/>
    <circle cx="125" cy="-40" r="50" fill="#6B5D42"/>
    <circle cx="135" cy="-40" r="50" fill="#6B5D42"/>

    <!-- Голова -->
    <ellipse cx="130" cy="-30" rx="40" ry="35" fill="#D4A574"/>

    <!-- Морда -->
    <ellipse cx="155" cy="-20" rx="28" ry="22" fill="#E8C89E"/>
    <ellipse cx="160" cy="-25" rx="15" ry="10" fill="#E8C89E"/>

    <!-- Нос -->
    <ellipse cx="170" cy="-30" rx="8" ry="6" fill="#5D4E37"/>

    <!-- Глаза - смотрит вверх на небо -->
    <ellipse cx="145" cy="-45" rx="8" ry="6" fill="white"/>
    <circle cx="147" cy="-47" r="4" fill="#2C1810"/>
    <circle cx="148" cy="-48" r="2" fill="white"/>

    <ellipse cx="120" cy="-45" rx="8" ry="6" fill="white"/>
    <circle cx="122" cy="-47" r="4" fill="#2C1810"/>
    <circle cx="123" cy="-48" r="2" fill="white"/>

    <!-- Уши -->
    <ellipse cx="105" cy="-55" rx="12" ry="15" fill="#D4A574"/>
    <ellipse cx="155" cy="-55" rx="12" ry="15" fill="#D4A574"/>
    <ellipse cx="105" cy="-55" rx="8" ry="10" fill="#E8C89E"/>
    <ellipse cx="155" cy="-55" rx="8" ry="10" fill="#E8C89E"/>

    <!-- Брови -->
    <path d="M 110 -52 Q 120 -55 130 -52" stroke="#5D4E37" stroke-width="3" fill="none"/>
    <path d="M 135 -52 Q 145 -55 155 -52" stroke="#5D4E37" stroke-width="3" fill="none"/>

    <!-- Рот -->
    <path d="M 165 -10 Q 170 -5 175 -10" stroke="#5D4E37" stroke-width="2" fill="none"/>

  </g>

  <!-- Передняя трава (на переднем плане) -->
  <g fill="#558B2F">
    <path d="M 50 600 L 55 570 L 60 600"/>
    <path d="M 80 600 L 87 560 L 94 600"/>
    <path d="M 120 600 L 125 575 L 130 600"/>
    <path d="M 200 600 L 208 555 L 216 600"/>
    <path d="M 280 600 L 285 580 L 290 600"/>
    <path d="M 350 600 L 358 550 L 366 600"/>
    <path d="M 500 600 L 507 560 L 514 600"/>
    <path d="M 580 600 L 585 575 L 590 600"/>
    <path d="M 650 600 L 658 555 L 666 600"/>
    <path d="M 720 600 L 725 580 L 730 600"/>
    <path d="M 760 600 L 768 550 L 776 600"/>
  </g>

  <!-- Дополнительные детали травы -->
  <g fill="#689F38">
    <path d="M 30 600 L 35 585 L 40 600"/>
    <path d="M 150 600 L 155 570 L 160 600"/>
    <path d="M 250 600 L 257 565 L 264 600"/>
    <path d="M 400 600 L 407 555 L 414 600"/>
    <path d="M 550 600 L 555 580 L 560 600"/>
    <path d="M 700 600 L 707 560 L 714 600"/>
  </g>
</svg>
