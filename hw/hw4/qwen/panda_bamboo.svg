    <rect x="520" y="180" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="230" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="280" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="330" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="380" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="430" width="12" height="5" fill="#4CAF50"/>
    <rect x="520" y="480" width="12" height="5" fill="#4CAF50"/>
    <ellipse cx="535" cy="200" rx="32" ry="11" fill="#8BC34A" transform="rotate(-30 535 200)"/>
    <ellipse cx="540" cy="220" rx="32" ry="11" fill="#8BC34A" transform="rotate(-25 540 220)"/>
