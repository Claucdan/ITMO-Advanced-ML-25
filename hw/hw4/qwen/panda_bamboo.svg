    <ellipse cx="-50" cy="95" rx="20" ry="15" fill="#263238"/>
    <ellipse cx="50" cy="95" rx="20" ry="15" fill="#263238"/>

    <!-- Голова -->
    <circle cx="0" cy="-30" r="60" fill="white"/>

    <!-- Уши -->
    <circle cx="-50" cy="-75" r="20" fill="#263238"/>
    <circle cx="50" cy="-75" r="20" fill="#263238"/>
    <circle cx="-50" cy="-75" r="12" fill="#424242"/>
    <circle cx="50" cy="-75" r="12" fill="#424242"/>

    <!-- Пятна вокруг глаз -->
    <ellipse cx="-25" cy="-35" rx="18" ry="22" fill="#263238"/>
    <ellipse cx="25" cy="-35" rx="18" ry="22" fill="#263238"/>

    <!-- Глаза -->
    <ellipse cx="-22" cy="-38" rx="8" ry="10" fill="white"/>
    <ellipse cx="28" cy="-38" rx="8" ry="10" fill="white"/>
    <circle cx="-20" cy="-40" r="4" fill="black"/>
    <circle cx="30" cy="-40" r="4" fill="black"/>
    <circle cx="-18" cy="-42" r="2" fill="white"/>
    <circle cx="32" cy="-42" r="2" fill="white"/>

    <!-- Нос -->
    <ellipse cx="0" cy="-15" rx="12" ry="8" fill="#263238"/>
    <ellipse cx="0" cy="-18" rx="6" ry="4" fill="white"/>

    <!-- Рот -->
    <path d="M -15 -5 Q 0 10 15 -5" stroke="#263238" stroke-width="3" fill="none"/>

    <!-- Передние лапы держат бамбук -->
    <ellipse cx="-40" cy="20" rx="22" ry="28" fill="#263238"/>
    <ellipse cx="40" cy="20" rx="22" ry="28" fill="#263238"/>
    <ellipse cx="-35" cy="25" rx="15" ry="18" fill="#424242"/>
    <ellipse cx="35" cy="25" rx="15" ry="18" fill="#424242"/>

    <!-- Бамбук в лапах -->
