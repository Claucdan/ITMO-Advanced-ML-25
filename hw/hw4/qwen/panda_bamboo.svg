    <g fill="#7CB342" stroke="#558B2F" stroke-width="2">
      <rect x="50" y="100" width="12" height="450"/>
      <rect x="50" y="100" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="150" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="200" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="250" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="300" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="350" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="400" width="12" height="5" fill="#4CAF50"/>
      <rect x="50" y="450" width="12" height="5" fill="#4CAF50"/>

      <rect x="150" y="80" width="10" height="470"/>
      <rect x="150" y="80" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="130" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="180" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="230" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="280" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="330" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="380" width="10" height="5" fill="#4CAF50"/>
      <rect x="150" y="430" width="10" height="5" fill="#4CAF50"/>

      <rect x="600" y="120" width="14" height="430"/>
      <rect x="600" y="120" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="170" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="220" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="270" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="320" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="370" width="14" height="5" fill="#4CAF50"/>
      <rect x="600" y="420" width="14" height="5" fill="#4CAF50"/>

      <rect x="700" y="90" width="11" height="460"/>
      <rect x="700" y="90" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="140" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="190" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="240" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="290" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="340" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="390" width="11" height="5" fill="#4CAF50"/>
      <rect x="700" y="440" width="11" height="5" fill="#4CAF50"/>

      <rect x="25" y="150" width="8" height="400"/>
      <rect x="750" y="110" width="9" height="440"/>
    </g>

    <!-- Листья бамбука на заднем плане -->
    <g fill="#8BC34A">
      <ellipse cx="70" cy="120" rx="25" ry="8" transform="rotate(-30 70 120)"/>
