    <ellipse cx="150" cy="520" rx="20" ry="8" transform="rotate(-15 150 520)"/>
    <ellipse cx="180" cy="540" rx="18" ry="7" transform="rotate(20 180 540)"/>
    <ellipse cx="250" cy="530" rx="22" ry="8" transform="rotate(-10 250 530)"/>
    <ellipse cx="550" cy="525" rx="19" ry="7" transform="rotate(15 550 525)"/>
    <ellipse cx="620" cy="545" rx="21" ry="8" transform="rotate(-20 620 545)"/>
    <ellipse cx="700" cy="535" rx="20" ry="7" transform="rotate(25 700 535)"/>
  </g>
