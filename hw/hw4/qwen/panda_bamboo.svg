      <rect x="-15" y="-50" width="30" height="200" fill="#7CB342"/>
      <rect x="-15" y="-50" width="30" height="6" fill="#4CAF50"/>
      <rect x="-15" y="-20" width="30" height="6" fill="#4CAF50"/>
      <rect x="-15" y="10" width="30" height="6" fill="#4CAF50"/>
      <rect x="-15" y="40" width="30" height="6" fill="#4CAF50"/>
      <rect x="-15" y="70" width="30" height="6" fill="#4CAF50"/>
      <rect x="-15" y="100" width="30" height="6" fill="#4CAF50"/>

      <!-- Листья бамбука -->
      <ellipse cx="20" cy="-40" rx="35" ry="12" fill="#8BC34A" transform="rotate(-20 20 -40)"/>
      <ellipse cx="25" cy="-25" rx="35" ry="12" fill="#8BC34A" transform="rotate(-15 25 -25)"/>
      <ellipse cx="20" cy="-10" rx="35" ry="12" fill="#8BC34A" transform="rotate(-25 20 -10)"/>

      <ellipse cx="-50" cy="-30" rx="30" ry="10" fill="#8BC34A" transform="rotate(150 -50 -30)"/>
      <ellipse cx="-55" cy="-15" rx="30" ry="10" fill="#8BC34A" transform="rotate(160 -55 -15)"/>
    </g>
  </g>

  <!-- Дополнительный бамбук вокруг главной панды -->
