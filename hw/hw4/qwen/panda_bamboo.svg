    <circle cx="-35" cy="-50" r="15" fill="#263238"/>
    <circle cx="35" cy="-50" r="15" fill="#263238"/>
    <ellipse cx="-18" cy="-25" rx="12" ry="15" fill="#263238"/>
    <ellipse cx="18" cy="-25" rx="12" ry="15" fill="#263238"/>
    <circle cx="-15" cy="-28" r="5" fill="white"/>
    <circle cx="21" cy="-28" r="5" fill="white"/>
    <circle cx="-13" cy="-26" r="2" fill="black"/>
    <circle cx="23" cy="-26" r="2" fill="black"/>
    <ellipse cx="0" cy="-10" rx="8" ry="5" fill="#263238"/>
    <ellipse cx="-35" cy="40" rx="18" ry="25" fill="#263238"/>
