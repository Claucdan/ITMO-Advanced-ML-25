      <ellipse cx="160" cy="90" rx="22" ry="7" transform="rotate(-25 160 90)"/>
      <ellipse cx="155" cy="110" rx="22" ry="7" transform="rotate(-15 155 110)"/>

      <ellipse cx="610" cy="130" rx="28" ry="9" transform="rotate(25 610 130)"/>
      <ellipse cx="615" cy="150" rx="28" ry="9" transform="rotate(35 615 150)"/>

      <ellipse cx="710" cy="100" rx="24" ry="8" transform="rotate(30 710 100)"/>
      <ellipse cx="705" cy="120" rx="24" ry="8" transform="rotate(20 705 120)"/>
    </g>
  </g>

  <!-- Панда на заднем плане слева -->
  <g transform="translate(200, 420) scale(0.6)">
