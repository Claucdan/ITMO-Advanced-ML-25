    <rect x="280" y="200" width="10" height="5" fill="#4CAF50"/>
    <rect x="280" y="250" width="10" height="5" fill="#4CAF50"/>
    <rect x="280" y="300" width="10" height="5" fill="#4CAF50"/>
    <rect x="280" y="350" width="10" height="5" fill="#4CAF50"/>
    <rect x="280" y="400" width="10" height="5" fill="#4CAF50"/>
