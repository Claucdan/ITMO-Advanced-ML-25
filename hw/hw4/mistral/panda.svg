<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- Фон -->
    <rect width="800" height="600" fill="skyblue"/>

    <!-- Бамбук вокруг панды -->
    <rect x="100" y="100" width="20" height="400" fill="green" stroke="darkgreen" stroke-width="5"/>
    <rect x="200" y="150" width="20" height="350" fill="green" stroke="darkgreen" stroke-width="5"/>
    <rect x="300" y="120" width="20" height="380" fill="green" stroke="darkgreen" stroke-width="5"/>
    <rect x="400" y="140" width="20" height="360" fill="green" stroke="darkgreen" stroke-width="5"/>
    <rect x="500" y="110" width="20" height="390" fill="green" stroke="darkgreen" stroke-width="5"/>
    <rect x="600" y="130" width="20" height="370" fill="green" stroke="darkgreen" stroke-width="5"/>

    <!-- Тело панды -->
    <ellipse cx="400" cy="400" rx="100" ry="150" fill="white" stroke="black" stroke-width="2"/>

    <!-- Голова панды -->
    <ellipse cx="400" cy="250" rx="70" ry="90" fill="white" stroke="black" stroke-width="2"/>

    <!-- Уши панды -->
    <ellipse cx="350" cy="180" rx="20" ry="30" fill="black"/>
    <ellipse cx="450" cy="180" rx="20" ry="30" fill="black"/>

    <!-- Глаза панды -->
    <circle cx="370" cy="220" r="15" fill="black"/>
    <circle cx="430" cy="220" r="15" fill="black"/>
    <circle cx="370" cy="220" r="8" fill="white"/>
    <circle cx="430" cy="220" r="8" fill="white"/>

    <!-- Нос панды -->
    <path d="M400,260 Q380,280 360,260 Q340,240 360,220 Q380,200 400,220 Q420,200 440,220 Q460,240 440,260 Q420,280 400,260" fill="black"/>

    <!-- Рот панды -->
    <path d="M360,260 Q380,280 400,260 Q420,280 440,260" stroke="black" fill="transparent"/>

    <!-- Лапы панды -->
    <ellipse cx="300" cy="500" rx="30" ry="50" fill="white" stroke="black" stroke-width="2"/>
    <ellipse cx="500" cy="500" rx="30" ry="50" fill="white" stroke="black" stroke-width="2"/>
    <ellipse cx="300" cy="500" rx="30" ry="50" fill="white" stroke="black" stroke-width="2"/>
    <ellipse cx="500" cy="500" rx="30" ry="50" fill="white" stroke="black" stroke-width="2"/>

    <!-- Бамбук в руках панды -->
    <rect x="350" y="200" width="20" height="150" fill="green" stroke="darkgreen" stroke-width="5" transform="rotate(20 360 275)"/>
</svg>
